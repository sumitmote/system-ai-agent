<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #334155; }
      .zoneTitle { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .boxTitle { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 500 13px Arial, sans-serif; fill: #1e293b; }
      .label { font: 600 13px Arial, sans-serif; fill: #0f172a; }
      .step { font: 700 13px Arial, sans-serif; fill: #ffffff; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="#f8fafc"/>
  <text x="40" y="52" class="title">Secure RAG Architecture (Confidential Data, Self-Hosted)</text>
  <text x="40" y="82" class="subtitle">Reference design for Spring + pgvector + Ollama with isolation, redaction, and policy controls</text>

  <rect x="30" y="120" width="1540" height="300" rx="14" ry="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="50" y="150" class="zoneTitle">Zone A - Application Segment (private subnet, no public ingress)</text>

  <rect x="70" y="180" width="260" height="170" rx="10" ry="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="210" class="boxTitle">Client UI</text>
  <text x="90" y="232" class="boxText">Angular web app / internal users</text>
  <text x="90" y="252" class="boxText">Only HTTPS to API gateway</text>

  <rect x="380" y="180" width="280" height="170" rx="10" ry="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="210" class="boxTitle">API Gateway + Auth</text>
  <text x="400" y="232" class="boxText">SSO / OAuth2 / mTLS</text>
  <text x="400" y="252" class="boxText">Rate limit and audit trail</text>
  <text x="400" y="272" class="boxText">No payload logging</text>

  <rect x="720" y="180" width="300" height="170" rx="10" ry="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="740" y="210" class="boxTitle">Spring RAG Service</text>
  <text x="740" y="232" class="boxText">ChatController + retrieval</text>
  <text x="740" y="252" class="boxText">Prompt templates + policy checks</text>
  <text x="740" y="272" class="boxText">Strict service account access</text>

  <rect x="1080" y="180" width="460" height="170" rx="10" ry="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="1100" y="210" class="boxTitle">Redaction and DLP Middleware</text>
  <text x="1100" y="232" class="boxText">Input scrubber: remove secrets/PII before embedding/prompting</text>
  <text x="1100" y="252" class="boxText">Output scan: prevent accidental sensitive leakage</text>
  <text x="1100" y="272" class="boxText">Policy engine: block disallowed data classes</text>

  <rect x="30" y="450" width="1540" height="340" rx="14" ry="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="50" y="480" class="zoneTitle">Zone B - AI and Data Segment (isolated subnet, private endpoints only)</text>

  <rect x="70" y="520" width="300" height="210" rx="10" ry="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="90" y="550" class="boxTitle">Knowledge Ingestion Worker</text>
  <text x="90" y="572" class="boxText">Reads approved docs from secure store</text>
  <text x="90" y="592" class="boxText">Chunks + metadata tagging</text>
  <text x="90" y="612" class="boxText">Redact before embedding</text>
  <text x="90" y="632" class="boxText">Signed ingestion job logs</text>

  <rect x="430" y="520" width="300" height="210" rx="10" ry="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="450" y="550" class="boxTitle">Self-hosted Ollama</text>
  <text x="450" y="572" class="boxText">No internet egress from runtime</text>
  <text x="450" y="592" class="boxText">Model files on encrypted disk</text>
  <text x="450" y="612" class="boxText">Access via internal allowlist</text>

  <rect x="790" y="520" width="320" height="210" rx="10" ry="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="810" y="550" class="boxTitle">PostgreSQL + pgvector</text>
  <text x="810" y="572" class="boxText">Vectors + metadata only</text>
  <text x="810" y="592" class="boxText">TDE/disk encryption + backups</text>
  <text x="810" y="612" class="boxText">Row-level access controls (if needed)</text>
  <text x="810" y="632" class="boxText">Retention and delete policies</text>

  <rect x="1170" y="520" width="370" height="210" rx="10" ry="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1190" y="550" class="boxTitle">Security Ops and Monitoring</text>
  <text x="1190" y="572" class="boxText">Central SIEM, alerting, anomaly detection</text>
  <text x="1190" y="592" class="boxText">Secrets manager, key rotation, cert lifecycle</text>
  <text x="1190" y="612" class="boxText">Vulnerability scans and patch cadence</text>
  <text x="1190" y="632" class="boxText">No sensitive prompt/response retention</text>

  <line x1="330" y1="265" x2="380" y2="265" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="660" y1="265" x2="720" y2="265" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1020" y1="265" x2="1080" y2="265" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="1230" y1="350" x2="1230" y2="520" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1240" y="438" class="label">Policy-enforced data flow</text>

  <line x1="370" y1="620" x2="430" y2="620" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="382" y="606" class="label">Embeddings</text>

  <line x1="730" y1="620" x2="790" y2="620" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="742" y="606" class="label">Store vectors</text>

  <line x1="1020" y1="580" x2="1170" y2="580" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1035" y="566" class="label">Audit + alerts</text>

  <line x1="940" y1="520" x2="940" y2="350" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="952" y="434" class="label">Retrieved context</text>

  <circle cx="78" cy="860" r="14" fill="#2563eb"/><text x="73" y="865" class="step">1</text>
  <text x="100" y="865" class="boxText">Classify documents (public/internal/confidential) before ingestion.</text>

  <circle cx="610" cy="860" r="14" fill="#2563eb"/><text x="605" y="865" class="step">2</text>
  <text x="632" y="865" class="boxText">Redact/tokenize sensitive fields, then chunk and embed only approved content.</text>

  <circle cx="1180" cy="860" r="14" fill="#2563eb"/><text x="1175" y="865" class="step">3</text>
  <text x="1202" y="865" class="boxText">Enforce access, monitor continuously, and run periodic leakage tests.</text>
</svg>

