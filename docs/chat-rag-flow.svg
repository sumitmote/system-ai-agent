<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #334155; }
      .boxTitle { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 500 14px Arial, sans-serif; fill: #1e293b; }
      .label { font: 600 14px Arial, sans-serif; fill: #0f172a; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="860" fill="#f8fafc"/>
  <text x="40" y="55" class="title">Spring AI Demo: End-to-End Chat RAG Flow</text>
  <text x="40" y="85" class="subtitle">Question path from UI to response, including retrieval and vector store usage</text>

  <rect x="60" y="140" rx="10" ry="10" width="260" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="175" class="boxTitle">1) Angular UI</text>
  <text x="80" y="200" class="boxText">User types message and clicks Send</text>
  <text x="80" y="222" class="boxText">POST /api/chat with { message }</text>

  <rect x="390" y="140" rx="10" ry="10" width="280" height="140" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="410" y="175" class="boxTitle">2) Dev Proxy (Vite)</text>
  <text x="410" y="200" class="boxText">ui/proxy.conf.json</text>
  <text x="410" y="222" class="boxText">Forwards /api/* to</text>
  <text x="410" y="244" class="boxText">http://127.0.0.1:8080</text>

  <rect x="750" y="130" rx="10" ry="10" width="310" height="170" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="770" y="165" class="boxTitle">3) Spring Boot API</text>
  <text x="770" y="190" class="boxText">POST /api/chat</text>
  <text x="770" y="212" class="boxText">ChatController.chat(...)</text>
  <text x="770" y="234" class="boxText">Validates request message</text>
  <text x="770" y="256" class="boxText">Calls ChatClient.prompt().user(...)</text>
  <text x="770" y="278" class="boxText">.call().content()</text>

  <rect x="1120" y="130" rx="10" ry="10" width="220" height="170" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="1140" y="165" class="boxTitle">4) Ollama LLM</text>
  <text x="1140" y="190" class="boxText">chat model: llama3.2</text>
  <text x="1140" y="212" class="boxText">Generates final answer</text>
  <text x="1140" y="234" class="boxText">using retrieved context</text>

  <rect x="750" y="380" rx="10" ry="10" width="320" height="220" fill="#fae8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="770" y="415" class="boxTitle">5) Retrieval Layer (RAG)</text>
  <text x="770" y="440" class="boxText">Embeds user query</text>
  <text x="770" y="462" class="boxText">Searches nearest vectors</text>
  <text x="770" y="484" class="boxText">in pgvector store</text>
  <text x="770" y="506" class="boxText">Returns relevant chunks as context</text>
  <text x="770" y="528" class="boxText">Context injected into prompt</text>

  <rect x="1120" y="380" rx="10" ry="10" width="220" height="220" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1140" y="415" class="boxTitle">6) PostgreSQL</text>
  <text x="1140" y="440" class="boxText">pgvector extension</text>
  <text x="1140" y="462" class="boxText">Stores embeddings</text>
  <text x="1140" y="484" class="boxText">and metadata</text>
  <text x="1140" y="506" class="boxText">(source file info)</text>

  <rect x="60" y="380" rx="10" ry="10" width="610" height="220" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="80" y="415" class="boxTitle">7) Response Back to UI</text>
  <text x="80" y="440" class="boxText">Spring returns JSON: { answer: "..." }</text>
  <text x="80" y="462" class="boxText">Angular app appends assistant message to conversation</text>
  <text x="80" y="484" class="boxText">Assistant text is rendered in presentable markdown format</text>
  <text x="80" y="506" class="boxText">On failure: UI shows "Unable to reach the chat API..."</text>

  <line x1="320" y1="200" x2="390" y2="200" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="330" y="188" class="label">HTTP POST</text>

  <line x1="670" y1="210" x2="750" y2="210" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="682" y="198" class="label">Forward</text>

  <line x1="1060" y1="220" x2="1120" y2="220" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1068" y="208" class="label">Prompt</text>

  <line x1="910" y1="300" x2="910" y2="380" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="920" y="348" class="label">Retrieve context</text>

  <line x1="1070" y1="490" x2="1120" y2="490" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1076" y="476" class="label">Vector search</text>

  <line x1="1120" y1="560" x2="670" y2="560" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="875" y="548" class="label">Answer + context used</text>

  <line x1="750" y1="500" x2="670" y2="500" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="676" y="488" class="label">JSON response</text>

  <text x="40" y="810" class="subtitle">Main files: ui/src/app/app.ts | ui/proxy.conf.json | src/main/java/com/example/springaidemo/ChatController.java | src/main/java/com/example/springaidemo/KnowledgeLoader.java | src/main/resources/application.yml</text>
</svg>

